name: Validate

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python scripts/sync_metadata.py --check
      - name: Shell integration prerequisites
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for tool in bash git jq; do
            if command -v "$tool" >/dev/null 2>&1; then
              printf 'found %s: %s\n' "$tool" "$(command -v "$tool")"
            else
              missing+=("$tool")
            fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            printf 'Missing required shell tool(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi
      - run: python -m unittest discover -s tests -v
      - name: ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck plugins/agent-task/git-hooks/* plugins/agent-task/scripts/*.sh plugins/agent-task/statusline/*.sh
      - name: Release tag matches version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/validate.py --tag "$RELEASE_TAG"
